<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#7b61ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0a0e1a"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="url(#g)" stroke-width="0.8" opacity="0.5"/>
  <text x="16" y="12" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="8" fill="url(#g)" text-anchor="middle" filter="url(#glow)" dominant-baseline="central" letter-spacing="0.5">&lt;</text>
  <text x="16" y="21" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="11" fill="url(#g)" text-anchor="middle" filter="url(#glow)" dominant-baseline="central" letter-spacing="-0.5">DM</text>
  <text x="16" y="29" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="8" fill="url(#g)" text-anchor="middle" filter="url(#glow)" dominant-baseline="central" letter-spacing="0.5">/&gt;</text>
</svg>